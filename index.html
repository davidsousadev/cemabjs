<head>

        content="CEMAB JS é um playground JavaScript online para escrever, executar e testar código JS direto no navegador. Editor com syntax highlighting, terminal interativo e salvamento de arquivos.">
    <meta name="keywords"
        content="javascript, editor javascript online, playground js, executar javascript no navegador, cemab js, code editor, terminal javascript">
    <meta name="author" content="David Sousa">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#0f172a">
    <link rel="canonical" href="https://davidsousadev.github.io/cemabjs/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="CEMAB JS - Editor JavaScript Online">
    <meta property="og:description"
        content="Escreva, execute e teste código JavaScript diretamente no navegador com syntax highlighting e terminal interativo.">
    <meta property="og:url" content="https://davidsousadev.github.io/cemabjs/">
    <meta property="og:site_name" content="CEMAB JS">
    <meta property="og:image" content="https://davidsousadev.github.io/cemabjs/assets/img/icon.jpeg">
    <meta property="og:image:alt" content="Logo do CEMAB JS">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="CEMAB JS - Editor JavaScript Online">
    <meta name="twitter:description"
        content="Escreva, execute e teste código JavaScript diretamente no navegador.">
    <meta name="twitter:image" content="https://davidsousadev.github.io/cemabjs/assets/img/icon.jpeg">

    <!-- Favicon / PWA -->
    <link rel="icon" type="image/jpeg" href="assets/img/icon.jpeg">
    <link rel="apple-touch-icon" href="assets/img/icon.jpeg">
    <link rel="manifest" href="site.webmanifest">

    <!-- Performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <!-- Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CEMAB JS",
      "url": "https://davidsousadev.github.io/cemabjs/",
      "description": "Editor JavaScript online para escrever, executar e testar código JS no navegador.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "author": {
        "@type": "Person",
        "name": "David Sousa",
        "url": "https://github.com/davidsousadev"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "BRL"
      }
    }
    </script>
</head>

<body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    <header class="site-header">
        <img src="assets/img/icon.jpeg" width="32" height="32" alt="Logo CEMAB JS">
        <span class="brand">CEMAB - JS</span>
    </header>

    <main id="main">
        <section aria-labelledby="editor-title">
            <h1 id="editor-title" class="sr-only">Editor JavaScript Online</h1>

            <div class="editor-wrapper">
                <textarea id="editor" aria-label="Editor de código JavaScript"></textarea>
            </div>

            <div class="toolbar" role="toolbar" aria-label="Ações do editor">
                <button type="button" onclick="executar()">▶ Executar</button>
                <button type="button" onclick="limpar()">🧹 Limpar</button>
                <button type="button" onclick="salvar()">💾 Salvar</button>
            </div>

            <div class="terminal" id="saida" role="log" aria-live="polite" aria-label="Saída do terminal"></div>

            <!-- input invisível para captura de teclado -->
            <input id="fakeInput" type="text" aria-hidden="true" tabindex="-1"
                style="opacity:0; position:absolute; left:-9999px;">
        </section>
    </main>

    <footer class="site-footer">
        Criado com ❤️ por <a href="https://github.com/davidsousadev" target="_blank" rel="noopener noreferrer">David Sousa</a>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js" defer></script>
    <script src="assets/js/app.js" defer></script>
</body>

</html>
